[project]
name = "enterprise-search-backend"
version = "0.1.0"
description = "Enterprise Search FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
enterprise-search-api = "app.main:run"
init-services = "init_services.run:main"
