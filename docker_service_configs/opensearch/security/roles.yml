# Applied via Security REST API by init_services (not auto-loaded at boot).
# DLS uses JWT authenticator attributes. ${user.roles} expands to a quoted
# comma-separated list of backend roles from the flattened Keycloak `roles` claim.
files_searcher:
  description: "Read chunks allowed by role or group RACL"
  cluster_permissions:
    - "cluster_composite_ops_ro"
  index_permissions:
    - index_patterns:
        - "enterprise-search-chunks"
      allowed_actions:
        - "read"
        - "search"
      dls: >-
        {"bool":{"should":[{"terms":{"allowed_roles":[${user.roles}]}},{"terms":{"allowed_groups":[${attr.jwt.groups}]}}],"minimum_should_match":1}}

files_writer:
  description: "Backend service ingest and ACL updates; no DLS"
  cluster_permissions:
    - "cluster_composite_ops"
  index_permissions:
    - index_patterns:
        - "enterprise-search-chunks"
      allowed_actions:
        - "crud"
        - "create_index"
        - "manage"
